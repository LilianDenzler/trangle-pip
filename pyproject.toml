[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcrgeometry"
version = "0.1.7"
description = "TCR geometry calculation and visualization tools"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Lilian Denzler", email = "lilian.denzler@yale.edu" }]

# pin minimal versions you’ve tested
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "biopython>=1.80",
  "biotite>=0.40",
  "MDAnalysis>=2.4",
  "tqdm>=4.65",
]

# Optional groups:
[project.optional-dependencies]
vis = ["pymol-open-source>=2.5"]   # or leave out if not needed

# create console commands: pip installs these as scripts
[project.scripts]
tcr-calc = "tcrgeometry.calc_geometry:main"
tcr-calc-md = "tcrgeometry.calc_geometry_MD:main"
tcr-change = "tcrgeometry.change_geometry:main"
tcr-extract-anchor = "tcrgeometry.get_anchor_coords:main"

[project.urls]
Homepage = "https://github.com/LilianDenzler/TCRangle"
Issues = "https://github.com/LilianDenzler/TCRangle/issues"

[tool.setuptools]
package-dir = {"" = "src"}

# auto-include all packages under src/
[tool.setuptools.packages.find]
where = ["src"]
include = ["tcrgeometry*"]

# include non-Python files inside the package
[tool.setuptools.package-data]
tcrgeometry = ["data/**/*"]
